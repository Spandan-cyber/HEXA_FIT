    // ---- MEMO / WORKOUT JOURNAL ----
    const MEMO_STORAGE_KEY = "hexafit_memos";

    function loadMemos() {
      try {
        const raw = localStorage.getItem(MEMO_STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) { return []; }
    }

    function saveMemos(memos) {
      try { localStorage.setItem(MEMO_STORAGE_KEY, JSON.stringify(memos)); } catch (e) {}
    }

    function MemoSection() {
      const [memos, setMemos] = useState(loadMemos);
      const [title, setTitle] = useState("");
      const [body, setBody] = useState("");
      const [category, setCategory] = useState("general");
      const [search, setSearch] = useState("");
      const [filterCat, setFilterCat] = useState("all");
      const [editingId, setEditingId] = useState(null);

      const categories = [
        { key: "workout", label: "Workout", cls: "cat-workout" },
        { key: "nutrition", label: "Nutrition", cls: "cat-nutrition" },
        { key: "recovery", label: "Recovery", cls: "cat-recovery" },
        { key: "mindset", label: "Mindset", cls: "cat-mindset" },
        { key: "general", label: "General", cls: "" },
      ];

      function persist(next) {
        setMemos(next);
        saveMemos(next);
      }

      function handleSubmit(e) {
        e.preventDefault();
        if (!body.trim()) return;
        if (editingId) {
          const next = memos.map((m) =>
            m.id === editingId
              ? { ...m, title: title.trim() || "Untitled", body: body.trim(), category, updatedAt: Date.now() }
              : m
          );
          persist(next);
          setEditingId(null);
        } else {
          const memo = {
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            title: title.trim() || "Untitled",
            body: body.trim(),
            category,
            pinned: false,
            createdAt: Date.now(),
            updatedAt: Date.now(),
          };
          persist([memo, ...memos]);
        }
        setTitle("");
        setBody("");
        setCategory("general");
      }

      function deleteMemo(id) {
        persist(memos.filter((m) => m.id !== id));
        if (editingId === id) {
          setEditingId(null);
          setTitle("");
          setBody("");
          setCategory("general");
        }
      }

      function togglePin(id) {
        persist(memos.map((m) => m.id === id ? { ...m, pinned: !m.pinned } : m));
      }

      function startEdit(memo) {
        setEditingId(memo.id);
        setTitle(memo.title);
        setBody(memo.body);
        setCategory(memo.category);
      }

      function cancelEdit() {
        setEditingId(null);
        setTitle("");
        setBody("");
        setCategory("general");
      }

      function formatTime(ts) {
        const d = new Date(ts);
        const day = d.toLocaleDateString("en-IN", { day: "2-digit", month: "short" });
        const time = d.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
        return day + " · " + time;
      }

      const filtered = memos
        .filter((m) => filterCat === "all" || m.category === filterCat)
        .filter((m) => {
          if (!search.trim()) return true;
          const q = search.toLowerCase();
          return m.title.toLowerCase().includes(q) || m.body.toLowerCase().includes(q);
        })
        .sort((a, b) => {
          if (a.pinned && !b.pinned) return -1;
          if (!a.pinned && b.pinned) return 1;
          return b.createdAt - a.createdAt;
        });

      return (
        <section id="memo">
          <div className="wrap">
            <Reveal className="section-head">
              <div className="eyebrow">Workout Memo</div>
              <h2>Your fitness journal. Write it down, keep it real.</h2>
              <p>Jot workout notes, meal ideas, recovery thoughts, or mindset wins. Memos persist in your browser — nothing uploaded.</p>
            </Reveal>
            <Reveal className="memo-layout" style={{ display: "grid" }}>
              <form className="memo-composer" onSubmit={handleSubmit}>
                <h4><span className="mc-icon">✎</span>{editingId ? "Edit memo" : "New memo"}</h4>
                <div className="memo-field">
                  <label htmlFor="memo-title">Title</label>
                  <input id="memo-title" type="text" placeholder="e.g. Leg day notes" value={title} onChange={(e) => setTitle(e.target.value)} />
                </div>
                <div className="memo-field">
                  <label htmlFor="memo-body">Memo</label>
                  <textarea id="memo-body" rows="5" placeholder="What's on your mind?" required value={body} onChange={(e) => setBody(e.target.value)}></textarea>
                </div>
                <div className="memo-field">
                  <label>Category</label>
                  <div className="memo-cats">
                    {categories.map((c) => (
                      <button
                        key={c.key}
                        type="button"
                        className={`memo-cat-btn ${c.cls} ${category === c.key ? "active" : ""}`}
                        onClick={() => setCategory(c.key)}
                      >
                        {c.label}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="memo-actions">
                  <PressButton type="submit" className="btn-primary">{editingId ? "Save changes" : "Add memo"}</PressButton>
                  {editingId && <PressButton className="" onClick={cancelEdit}>Cancel</PressButton>}
                </div>
              </form>

              <div>
                <div className="memo-search">
                  <input type="text" placeholder="Search memos…" value={search} onChange={(e) => setSearch(e.target.value)} />
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: "6px", marginBottom: "18px" }}>
                  <button className={`memo-filter-btn ${filterCat === "all" ? "active" : ""}`} onClick={() => setFilterCat("all")}>All</button>
                  {categories.map((c) => (
                    <button key={c.key} className={`memo-filter-btn ${filterCat === c.key ? "active" : ""}`} onClick={() => setFilterCat(c.key)}>{c.label}</button>
                  ))}
                </div>
                <div className="memo-count">{filtered.length} memo{filtered.length !== 1 ? "s" : ""}{filterCat !== "all" ? " in " + filterCat : ""}</div>

                {filtered.length === 0 ? (
                  <div className="memo-empty">
                    <div className="me-icon">📝</div>
                    <p>{memos.length === 0 ? "No memos yet — write your first one." : "No memos match your search."}</p>
                  </div>
                ) : (
                  <div className="memo-list">
                    {filtered.map((m) => (
                      <div key={m.id} className={`memo-card ${m.pinned ? "pinned" : ""}`}>
                        <div className="memo-card-head">
                          <span className="memo-card-title">{m.pinned ? "📌 " : ""}{m.title}</span>
                          <span className={`memo-card-tag t-${m.category}`}>{m.category}</span>
                        </div>
                        <div className="memo-card-body">{m.body}</div>
                        <div className="memo-card-footer">
                          <span className="memo-card-time">{formatTime(m.createdAt)}{m.updatedAt > m.createdAt + 1000 ? " · edited" : ""}</span>
                          <div className="memo-card-btns">
                            <button onClick={() => togglePin(m.id)} title={m.pinned ? "Unpin" : "Pin"} className={m.pinned ? "pin-active" : ""}>📌</button>
                            <button onClick={() => startEdit(m)} title="Edit">✏️</button>
                            <button onClick={() => deleteMemo(m.id)} title="Delete">🗑</button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
                <div className="memo-storage-note">Stored in localStorage · browser-only · not synced</div>
              </div>
            </Reveal>
          </div>
        </section>
      );
    }

    function App() {
      return (
        <div id="top">
          <Nav />
          <Marquee />
          <main>
            <Hero />
            <Problem />
            <Audience />
            <Features />
            <Journey />
            <SensorSection />
            <TechArchitecture />
            <Metrics />
            <Risks />
            <Roadmap />
            <MemoSection />
            <Support />
          </main>
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
